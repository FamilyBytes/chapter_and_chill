<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter &amp; Chill · Calendarios de lectura</title>
<meta name="description" content="Calendarios de lectura para BookTok: planifica capítulos, marca tu progreso y comparte tus stories.">
<meta name="theme-color" content="#f7f1e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chapter &amp; Chill">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta base de la app (beige / marrón suave) */
    --app-bg: #f7f1e8; --app-card: #fffcf7; --app-soft: #efe5d7; --app-line: #e4d6c3;
    --app-accent: #d9bc9c; --app-strong: #7a5a3e; --app-text: #4d3a2a; --app-muted: #9a8470;

    /* Paleta activa (la cambia cada calendario) */
    --bg: var(--app-bg); --card: var(--app-card); --soft: var(--app-soft); --soft2: #e6d7c3; --line: var(--app-line);
    --accent: var(--app-accent); --accent-mid: #c9a682; --accent-strong: var(--app-strong);
    --text: var(--app-text); --muted: var(--app-muted); --day-bg: #fffdf9; --shadow: rgba(122, 90, 62, .10);
    --font-title: 'Caveat';

    --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-pill: 999px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --header-h: 68px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: calc(var(--header-h) + 16px); }
  body {
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive; font-size: 17px; line-height: 1.4;
    color: var(--text); background: var(--bg); min-height: 100vh;
    display: flex; flex-direction: column; transition: background-color .4s, color .4s;
  }
  h1, h2, h3, legend, .titulo-font { font-family: var(--font-title), cursive; font-weight: 700; line-height: 1.05; font-synthesis: none; }
  button, input, textarea { font-family: inherit; color: inherit; font-size: inherit; }
  a { color: inherit; }
  /* Sin barras de desplazamiento visibles; rueda, táctil y teclado siguen funcionando */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  svg.ic { width: 1.2em; height: 1.2em; flex-shrink: 0; }
  .relleno .rel, .check .rel { fill: currentColor; fill-opacity: .22; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: var(--s5); padding-right: var(--s5); }

  /* ---------- Cabecera (siempre beige) ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30; height: var(--header-h);
    background: color-mix(in srgb, var(--app-bg) 90%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--app-line); color: var(--app-text);
  }
  .topbar .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .logo { text-decoration: none; display: flex; align-items: center; gap: var(--s2); color: var(--app-strong); min-width: 0; }
  .logo .burbuja { width: 40px; height: 40px; border-radius: 50%; background: var(--app-soft); display: grid; place-items: center; flex-shrink: 0; }
  .logo .burbuja svg { width: 24px; height: 24px; }
  .logo b { font-family: 'Caveat', cursive; font-size: 1.9rem; line-height: 1; white-space: nowrap; margin-right: var(--s1); }
  .logo small { font-size: .9rem; color: var(--app-muted); white-space: nowrap; }
  nav { display: flex; gap: var(--s1); }
  nav a {
    text-decoration: none; height: 40px; padding: 0 var(--s4); display: inline-flex; gap: var(--s2); align-items: center;
    border-radius: var(--r-pill); color: var(--app-text); transition: background .2s;
  }
  nav a:hover { background: var(--app-soft); }
  nav a.activo { color: var(--app-text); background: var(--app-accent); }

  main { flex: 1; padding-top: var(--s6); padding-bottom: var(--s7); }
  footer {
    text-align: center; padding: var(--s5) var(--s4); color: var(--app-muted); font-size: .95rem;
    display: flex; gap: var(--s2); justify-content: center; align-items: center; flex-wrap: wrap;
    border-top: 1px solid var(--app-line); background: var(--app-bg);
  }

  /* ---------- Bloques comunes ---------- */
  .card { background: var(--card); border-radius: var(--r-lg); box-shadow: 0 1px 2px var(--shadow), 0 10px 30px var(--shadow); padding: var(--s5); }
  .hero { text-align: center; margin-bottom: var(--s6); }
  .hero h1 { font-size: clamp(2.6rem, 6vw, 3.8rem); color: var(--accent-strong); }
  .hero p { color: var(--muted); margin-top: var(--s2); font-size: 1.1rem; }
  .sec-titulo { display: flex; align-items: center; gap: var(--s3); font-size: 1.9rem; color: var(--accent-strong); margin-bottom: var(--s4); }
  .burbuja-ic { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); color: var(--accent-strong); display: grid; place-items: center; flex-shrink: 0; }
  .burbuja-ic svg { width: 21px; height: 21px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    height: 42px; padding: 0 var(--s4); border-radius: var(--r-pill); border: 1px solid var(--line);
    background: var(--card); cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: background .2s, transform .15s, box-shadow .2s;
  }
  .btn:hover { background: var(--soft); transform: translateY(-1px); box-shadow: 0 4px 12px var(--shadow); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible, nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-strong); font-weight: 700; }
  .btn.primario:hover { background: var(--accent-mid); }
  .btn.peligro { color: #b0574a; border-color: #f0d2cb; }
  .btn.peligro:hover { background: #fbebe7; }
  .btn.mini { height: 36px; padding: 0 var(--s3); font-size: .95rem; }
  .btn.redondo { width: 42px; padding: 0; }
  .btn.mini.redondo { width: 36px; }
  .acciones { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }

  .barra { height: 12px; background: var(--soft); border-radius: var(--r-pill); overflow: hidden; }
  .barra > div { height: 100%; width: 0; border-radius: var(--r-pill); background: linear-gradient(90deg, var(--accent), var(--accent-mid)); transition: width .6s ease; }

  .badge {
    display: inline-flex; align-items: center; gap: var(--s1); font-size: .92rem; padding: 3px var(--s3);
    border-radius: var(--r-pill); background: var(--soft); color: var(--accent-strong);
  }
  .badge svg { width: 1.05em; height: 1.05em; }
  .badge.ok { background: var(--accent); }

  /* ---------- Portada ---------- */
  .portada {
    width: 100%; aspect-ratio: 2 / 3; overflow: hidden; position: relative; border-radius: var(--r-md);
    background: linear-gradient(155deg, var(--soft) 0%, var(--accent) 100%);
    box-shadow: 0 8px 22px var(--shadow); display: flex; align-items: center; justify-content: center;
  }
  .portada::before { content: ''; position: absolute; left: 8%; top: 0; bottom: 0; width: 6px; background: rgba(255,255,255,.35); border-radius: var(--r-pill); }
  .portada img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; }
  .portada .fallback { color: var(--accent-strong); text-align: center; padding: var(--s4) var(--s3) var(--s4) var(--s5); font-family: var(--font-title), cursive; position: relative; }
  .portada .fallback span { display: block; font-size: clamp(1.7rem, 4.4vw, 2.8rem); line-height: .95; word-break: break-word; font-weight: 700; }
  .portada .fallback small { display: block; margin-top: var(--s3); font-size: 1rem; font-family: 'Patrick Hand', cursive; opacity: .8; }

  /* ---------- Estantería ---------- */
  .estanteria { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s5); }
  .libro {
    text-decoration: none; display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4);
    background: var(--card); border-radius: var(--r-lg); color: var(--text);
    box-shadow: 0 1px 2px var(--shadow), 0 10px 28px var(--shadow); transition: transform .25s, box-shadow .25s;
  }
  .libro:hover { transform: translateY(-4px); box-shadow: 0 2px 4px var(--shadow), 0 18px 36px var(--shadow); }
  .libro:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .libro .portada { margin-bottom: var(--s1); }
  .libro h3 { font-size: 1.75rem; color: var(--accent-strong); }
  .libro .autor { color: var(--muted); }
  .libro .meta { font-size: .95rem; color: var(--muted); display: flex; justify-content: space-between; gap: var(--s2); }
  .libro.nuevo {
    align-items: center; justify-content: center; text-align: center; min-height: 420px; gap: var(--s2);
    background: transparent; box-shadow: none; border: 2px dashed var(--app-line); color: var(--app-strong);
  }
  .libro.nuevo:hover { background: var(--app-card); }
  .libro.nuevo .burbuja-ic { width: 64px; height: 64px; background: var(--app-soft); margin-bottom: var(--s2); }
  .libro.nuevo .burbuja-ic svg { width: 30px; height: 30px; }
  .vacio { text-align: center; padding: var(--s7) var(--s5); color: var(--muted); }

  /* ---------- Vista calendario ---------- */
  .cabecera-cal { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s6); }
  .cabecera-cal h1 { font-size: clamp(2.6rem, 6vw, 3.6rem); color: var(--accent-strong); }
  .cabecera-cal p { color: var(--muted); margin-top: var(--s1); }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: var(--s5); align-items: start; }
  aside { position: sticky; top: calc(var(--header-h) + var(--s5)); display: flex; flex-direction: column; gap: var(--s5); }
  .tracker h2 { font-size: 1.9rem; color: var(--accent-strong); margin-bottom: var(--s4); }
  .progreso-linea { display: flex; align-items: center; gap: var(--s3); }
  .progreso-linea .barra { flex: 1; }
  .porcentaje { font-size: 1.25rem; color: var(--accent-strong); min-width: 3ch; text-align: right; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: var(--s4); }
  .stat { background: var(--soft); border-radius: var(--r-md); padding: var(--s3) var(--s2); text-align: center; }
  .stat b { display: block; font-size: 1.6rem; color: var(--accent-strong); font-weight: 400; line-height: 1.1; }
  .stat small { font-size: .88rem; color: var(--muted); }
  .capitulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 6px; margin-top: var(--s4); }
  .cap { aspect-ratio: 1; border-radius: 50%; font-size: .78rem; display: grid; place-items: center; background: var(--soft); color: var(--muted); }
  .cap.leido { background: var(--accent); color: var(--accent-strong); }
  .info-extra { margin-top: var(--s4); color: var(--muted); }
  .info-extra b { color: var(--accent-strong); font-weight: 400; }
  .tracker .btn { margin-top: var(--s4); width: 100%; }

  .calendario h2 { font-size: 1.9rem; color: var(--accent-strong); }
  .calendario .sub { color: var(--muted); margin: var(--s1) 0 var(--s5); display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
  .calendario .sub svg { color: var(--accent-strong); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: var(--s3); }
  .dia {
    position: relative; aspect-ratio: 1; background: var(--day-bg); text-align: left; border: 1px solid var(--line);
    border-radius: var(--r-md); padding: var(--s3); display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer; transition: transform .2s, box-shadow .2s, background .3s, border-color .3s; overflow: hidden;
  }
  .dia:hover { transform: translateY(-3px); box-shadow: 0 10px 22px var(--shadow); }
  .dia:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .dia .num { font-family: var(--font-title), cursive; font-weight: 700; font-size: 2.4rem; line-height: .9; color: var(--accent-strong); display: block; }
  .dia .fecha { font-size: .88rem; color: var(--muted); }
  .dia .lectura { font-size: 1.02rem; line-height: 1.15; }
  .dia .check {
    position: absolute; top: var(--s3); right: var(--s3); width: 30px; height: 30px; border-radius: 50%;
    background: var(--soft); color: var(--accent-strong); display: grid; place-items: center; transition: background .3s;
  }
  .dia .check svg { width: 18px; height: 18px; }
  .dia.hecho { background: var(--accent); border-color: var(--accent); }
  .dia.hecho .check { background: var(--day-bg); }
  .dia.hecho .fecha { color: var(--accent-strong); opacity: .75; }
  .dia.hecho .lectura { color: var(--accent-strong); }
  .dia.descanso { cursor: default; background: var(--soft); border-style: dashed; }
  .dia.descanso:hover { transform: none; box-shadow: none; }
  .dia.descanso .check { display: none; }
  .dia.descanso .lectura { display: flex; gap: var(--s1); align-items: center; color: var(--muted); }
  .dia.movido { cursor: default; background: transparent; border-style: dashed; opacity: .75; }
  .dia.movido:hover { transform: none; box-shadow: none; }
  .dia.movido .check { display: none; }
  .dia.movido .lectura { display: flex; gap: var(--s1); align-items: center; color: var(--muted); font-size: .95rem; }
  .dia.movido .lectura svg { width: 15px; height: 15px; flex: none; }
  .plan-barra { display: flex; align-items: center; gap: var(--s2) var(--s3); flex-wrap: wrap; margin: calc(var(--s2) * -1) 0 var(--s5); }
  .plan-aviso { display: inline-flex; align-items: center; gap: var(--s2); padding: 6px 14px; border-radius: var(--r-pill); background: var(--soft); color: var(--accent-strong); font-size: .95rem; line-height: 1.2; }
  .plan-aviso svg { width: 17px; height: 17px; flex: none; }
  .plan-barra .btn { margin-left: auto; }
  .plan-barra .btn + .btn { margin-left: 0; }
  .plan-barra .enlace { background: none; border: 0; padding: 0 var(--s1); color: var(--muted); font: inherit; font-size: .92rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: var(--r-pill); }
  .plan-barra .enlace:hover { color: var(--accent-strong); }
  .dia.hoy { box-shadow: 0 0 0 2px var(--accent-strong); border-color: transparent; }
  .dia.hoy::after {
    content: 'hoy'; position: absolute; bottom: var(--s3); right: var(--s3); font-size: .85rem; line-height: 1;
    background: var(--accent-strong); color: var(--day-bg); padding: 4px 9px; border-radius: var(--r-pill);
  }
  .pop { animation: pop .45s ease; }
  @keyframes pop { 40% { transform: scale(1.06); } }
  .particula { position: fixed; left: 0; top: 0; pointer-events: none; color: var(--accent-strong); z-index: 60; width: 22px; height: 22px; will-change: transform, opacity; }
  .particula svg { width: 100%; height: 100%; display: block; }
  .particula.alt { color: var(--accent); }
  .particula.solida svg path { fill: currentColor; }
  .mensaje-final { margin-top: var(--s5); text-align: center; padding: var(--s4) var(--s5); background: var(--soft); border-radius: var(--r-md); color: var(--accent-strong); font-family: var(--font-title), cursive; font-size: 1.8rem; line-height: 1.1; }
  .columna { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
  .resumen-mov { display: none; }

  /* Portada que se llena de líquido según el progreso (móvil) */
  .liquido, .pct-portada { display: none; }
  .liquido { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .liquido::before, .liquido::after {
    content: ''; position: absolute; left: 50%; width: 280%; aspect-ratio: 1; margin-left: -140%;
    top: calc(104% - var(--p) * 1.08%); border-radius: 43%; background: var(--accent-strong); opacity: .2;
    animation: llenar 1.4s cubic-bezier(.3, .7, .3, 1), ola 7s linear infinite;
  }
  .liquido::before { margin-top: -6px; }
  .liquido::after { border-radius: 39%; background: var(--accent-mid); opacity: .75; animation-duration: 1.4s, 11s; animation-direction: normal, reverse; }
  @keyframes llenar { from { top: calc(104% - var(--p0) * 1.08%); } }
  @keyframes ola { to { transform: rotate(360deg); } }
  .pct-portada {
    position: absolute; z-index: 2; left: 50%; bottom: var(--s2); transform: translateX(-50%);
    background: color-mix(in srgb, var(--day-bg) 90%, transparent); color: var(--accent-strong);
    font-family: var(--font-title), cursive; font-weight: 700; font-size: 1.35rem; line-height: 1.15;
    padding: 1px var(--s3); border-radius: var(--r-pill); box-shadow: 0 2px 8px var(--shadow);
  }
  @media (prefers-reduced-motion: reduce) { .liquido::before, .liquido::after { animation: none; } }

  /* ---------- Diario lector ---------- */
  .solida .rel, svg.solida path { fill: currentColor; fill-opacity: 1; }
  .diario .sec-titulo { margin-bottom: var(--s5); }
  .diario-grid { display: grid; grid-template-columns: minmax(220px, 270px) 1fr; gap: var(--s5); }
  .valoracion { display: flex; flex-direction: column; gap: var(--s4); }
  .campo-val { background: var(--soft); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
  .campo-val .lbl { color: var(--accent-strong); }
  .val-txt { color: var(--muted); font-size: .92rem; }
  .val-txt b { color: var(--accent-strong); font-weight: 400; }
  .estrellas { display: flex; gap: 2px; cursor: pointer; width: max-content; border-radius: var(--r-pill); touch-action: manipulation; }
  .estrellas:focus-visible, .picante button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .estrella { position: relative; width: 34px; height: 34px; color: var(--accent-mid); }
  .estrella svg { width: 100%; height: 100%; display: block; }
  .estrella .lleno { position: absolute; inset: 0 auto 0 0; width: 0; overflow: hidden; color: var(--accent-strong); transition: width .15s; }
  .estrella .lleno svg { width: 34px; height: 34px; }
  .picante { display: flex; gap: 2px; }
  .picante button {
    width: 36px; height: 36px; border: none; background: transparent; padding: 3px; cursor: pointer; border-radius: 50%;
    color: var(--accent-mid); opacity: .45; transition: transform .15s, opacity .15s, color .15s;
  }
  .picante button svg { width: 100%; height: 100%; }
  .picante button.on { opacity: 1; color: var(--accent-strong); }
  .picante button:hover { transform: scale(1.12); }
  .notas { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
  .notas textarea { min-height: 120px; resize: none; overflow: hidden; line-height: 1.45; }
  .guardado { color: var(--muted); font-size: .88rem; display: inline-flex; align-items: center; gap: var(--s1); transition: color .3s; }
  .guardado.ok { color: var(--accent-strong); }
  .frases { margin-top: var(--s6); padding-top: var(--s5); border-top: 1px solid var(--line); }
  .sub-titulo { display: flex; align-items: center; gap: var(--s2); font-size: 1.6rem; color: var(--accent-strong); margin-bottom: var(--s4); }
  .sub-titulo .badge { font-family: 'Patrick Hand', cursive; font-size: .9rem; font-weight: 400; }
  .nueva-frase { display: flex; flex-direction: column; gap: var(--s3); margin-bottom: var(--s5); }
  .nueva-frase textarea { min-height: 72px; }
  .nueva-frase .fila { display: flex; gap: var(--s3); }
  .nueva-frase .fila input { flex: 1; min-width: 0; }
  .lista-frases { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--s3); }
  .frase { position: relative; background: var(--soft); border-radius: var(--r-md); padding: var(--s4) var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s3); }
  .frase.fav { background: var(--accent); }
  .frase .comillas { color: var(--accent-strong); opacity: .5; width: 26px; height: 26px; }
  .frase .comillas svg { width: 100%; height: 100%; }
  .frase p { font-size: 1.12rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .frase .pie { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: auto; }
  .frase .ref { font-size: .88rem; color: var(--accent-strong); opacity: .8; }
  .frase .acciones { gap: var(--s1); flex-wrap: nowrap; }
  .frase .btn { background: var(--day-bg); border-color: transparent; }
  .frase [data-act="fav"] { color: var(--accent-strong); }
  .sin-frases { grid-column: 1 / -1; color: var(--muted); display: flex; gap: var(--s2); align-items: center; justify-content: center; text-align: center; padding: var(--s5) var(--s4); border: 2px dashed var(--line); border-radius: var(--r-md); }

  /* ---------- Formulario ---------- */

  }

  .color-pop { display: none; }

  .slider:focus-visible { box-shadow: 0 0 0 4px var(--soft); }

  .arcoiris { background: conic-gradient(hsl(0,60%,82%), hsl(60,60%,82%), hsl(120,60%,82%), hsl(200,60%,82%), hsl(270,60%,82%), hsl(330,60%,82%), hsl(360,60%,82%)) !important; }
  .chips { display: flex; gap: var(--s2); flex-wrap: wrap; }

  .paletas { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--s2); }

  .resultados button:hover { border-color: var(--accent-strong); }
  .resultados img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .form-acciones { margin-top: var(--s6); padding-top: var(--s5); border-top: 1px solid var(--line); }
  .resumen-plan h3 { font-size: 1.7rem; color: var(--accent-strong); margin-bottom: var(--s2); }

  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: var(--s3); }

  .mini-grid div.r { background: var(--soft); color: var(--muted); }

  /* ---------- Panel de control ---------- */
  .panel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s5); }

  /* ---------- Confirmación ---------- */
  .confirma {

  @media (prefers-reduced-motion: reduce) { .confirma, .confirma-caja { animation: none !important; } }

  /* ---------- Compartir: modal + carrusel de stories ---------- */
  body.sin-scroll { overflow: hidden; }
  .share-modal {
    position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center;
    padding: max(var(--s4), env(safe-area-inset-top)) 0 max(var(--s4), env(safe-area-inset-bottom));
    background: color-mix(in srgb, #fbf6ef 72%, transparent); backdrop-filter: blur(16px) saturate(1.1); -webkit-backdrop-filter: blur(16px) saturate(1.1);
    color: var(--app-text); animation: shareIn .28s ease both; overflow: hidden;

  .share-fondo span:nth-child(3) { background: color-mix(in srgb, var(--accent) 45%, #f6ecdf); left: 10vw; bottom: -30vmax; animation-duration: 26s; animation-delay: -12s; opacity: .45; }
  @keyframes deriva { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(6vmax, 4vmax) scale(1.08); } 100% { transform: translate(-4vmax, 7vmax) scale(.95); } }
  .share-top { width: min(100%, 720px); padding: 0 var(--s5); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .share-top h2 { font-size: 2rem; color: var(--app-strong); }

function ensureFonts(names) {
  const nuevas = [...new Set(names)].filter(n => FONTS.includes(n) && !loadedFonts.has(n));
  if (!nuevas.length) return;
  nuevas.forEach(n => loadedFonts.add(n));

    const f = FONT_LIST.find(x => x.name === n);
    return 'family=' + n.replace(/ /g, '+') + (f.w ? ':wght@' + f.w : '');
  }).join('&');
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?${fam}&display=swap`;
  document.head.appendChild(link);
}

function toast(msg, icon = 'check') {
  const t = $('#toast');
  t.innerHTML = ic(icon) + '<span></span>';
  t.lastChild.textContent = msg;
  t.classList.add('visible');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('visible'), 2600);
}

function confirmar({ titulo, texto = '', nota = '', notaIcon = 'heart', ok = 'Aceptar', cancelar = 'Cancelar', icono = 'warning', okIcon = 'check', peligro = false }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const m = document.createElement('div');
    m.className = 'confirma' + (peligro ? ' peligro' : '');
    m.innerHTML = `
      <div class="confirma-caja" role="alertdialog" aria-modal="true" aria-labelledby="cf-t" aria-describedby="cf-d">
        <div class="confirma-ico">${ic(icono, 'relleno')}</div>
        <h2 id="cf-t">${esc(titulo)}</h2>
        ${texto ? `<p id="cf-d">${esc(texto)}</p>` : ''}
        ${nota ? `<span class="confirma-nota">${ic(notaIcon, 'relleno')}${esc(nota)}</span>` : ''}
        <div class="confirma-acciones">
          <button class="btn no" type="button">${esc(cancelar)}</button>
          <button class="btn primario si" type="button">${ic(okIcon)} ${esc(ok)}</button>
        </div>
      </div>`;
    document.body.appendChild(m);
    const yaBloqueado = document.body.classList.contains('sin-scroll');
    document.body.classList.add('sin-scroll');
    const btns = $$('.confirma-acciones .btn', m);
    (peligro ? btns[0] : btns[1]).focus();
    let hecho = false;
    const cerrar = v => {
      if (hecho) return; hecho = true;
      document.removeEventListener('keydown', teclas, true);
      m.classList.add('saliendo');
      setTimeout(() => {
        m.remove();
        if (!yaBloqueado) document.body.classList.remove('sin-scroll');
        if (prev && prev.isConnected) prev.focus({ preventScroll: true });
      }, 180);
      resolve(v);
    };
    const teclas = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cerrar(false); }
      else if (e.key === 'Tab') { e.preventDefault(); (document.activeElement === btns[0] ? btns[1] : btns[0]).focus(); }
    };
    document.addEventListener('keydown', teclas, true);
    m.addEventListener('click', e => {
      if (e.target === m) cerrar(false);
      else if (e.target.closest('.no')) cerrar(false);
      else if (e.target.closest('.si')) cerrar(true);
    });
  });
}

function download(nombre, contenido, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const slug = s => (s || 'calendario').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ================== Tema pastel ================== */
function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0; const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > .5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
}
// Cualquier color se convierte en una paleta pastel completa (fondo, tarjetas, acento y texto)
function themeVars(theme) {
  const t = { ...DEFAULT_THEME, ...theme };
  const { h, s } = hexToHsl(isHex(t.accent) ? t.accent : DEFAULT_THEME.accent);
  const S = s < 6 ? 8 : Math.min(62, Math.max(28, s));
  const p = k => Math.round(S * k);
  return {
    '--bg': `hsl(${h},${p(.7)}%,96.5%)`, '--card': `hsl(${h},${p(.8)}%,99.2%)`, '--day-bg': `hsl(${h},${p(.8)}%,99.5%)`,
    '--soft': `hsl(${h},${p(.85)}%,93%)`, '--soft2': `hsl(${h},${p(.8)}%,88%)`, '--line': `hsl(${h},${p(.55)}%,88%)`,
    '--accent': `hsl(${h},${S}%,82%)`, '--accent-mid': `hsl(${h},${S}%,74%)`, '--accent-strong': `hsl(${h},${p(.6)}%,34%)`,
    '--text': `hsl(${h},${p(.35)}%,24%)`, '--muted': `hsl(${h},${p(.22)}%,46%)`, '--shadow': `hsla(${h},${p(.5)}%,30%,.09)`,
    '--font-title': `'${FONTS.includes(t.font) ? (ensureFonts([t.font]), t.font) : DEFAULT_THEME.font}'`
  };
}
const pastelSwatches = hex => {
  const v = themeVars({ accent: hex });
  return [v['--soft'], v['--accent'], v['--accent-strong']];
};
const varsToStyle = v => Object.entries(v).map(([k, val]) => `${k}:${val}`).join(';');
function applyTheme(theme) {
  Object.entries(themeVars(theme)).forEach(([k, val]) => document.documentElement.style.setProperty(k, val));
}

/* ================== Datos ================== */
function normalizeCal(c) {
  const theme = { ...DEFAULT_THEME, ...(c.theme || {}) };
  delete theme.mode;
  if (LEGACY_ICONS[theme.icon]) theme.icon = LEGACY_ICONS[theme.icon];
  if (!MARK_ICONS.includes(theme.icon)) theme.icon = DEFAULT_THEME.icon;
  if (!FONTS.includes(theme.font)) theme.font = DEFAULT_THEME.font;
  if (!isHex(theme.accent)) theme.accent = DEFAULT_THEME.accent;
  const out = {

}

const SHARE_DEFAULT = { showMark: true, mark: '@nuribooks', markIcon: '', tag: '#booktok' };

const getCal = id => db.calendars.find(c => c.id === id);

/* ================== Plan de lectura ================== */
function buildUnits(cal) {
  const u = [];
  if (cal.prologue) u.push({ kind: 'p', n: 0, label: 'Prólogo', short: 'P' });
  for (let i = 1; i <= cal.totalChapters; i++) u.push({ kind: 'c', n: i, label: 'Cap. ' + i, short: String(i) });
  if (cal.epilogue) u.push({ kind: 'e', n: cal.totalChapters + 1, label: 'Epílogo', short: 'E' });
  return u;
}
function preReadCount(cal) {
  const last = Math.min(cal.lastRead, cal.totalChapters);
  return last + (cal.prologue && last >= 1 ? 1 : 0);
}
function planSig(cal) { return JSON.stringify([cal.totalChapters, !!cal.prologue, !!cal.epilogue, cal.lastRead, cal.planStart, cal.planEnd, [...(cal.restDays || [])].sort()]); }
function reorgValido(r, cal) { return !!(r && r.asig && typeof r.asig === 'object' && Array.isArray(r.movidos) && r.sig === planSig(cal)); }

// Recoge lo no leído de los días pasados sin marcar y lo reparte desde hoy en los días libres que quedan
function planRecalculado(cal) {
  const tk = todayKey(), plan = buildPlan(cal), all = buildUnits(cal), done = new Set(cal.done);
  const idx = new Map(all.map((u, i) => [u.label, i]));
  const leidos = new Set(Array.from({ length: preReadCount(cal) }, (_, i) => i));
  plan.forEach(d => { if (done.has(d.key)) d.units.forEach(u => leidos.add(idx.get(u.label))); });
  const atrasados = plan.filter(d => !d.rest && d.key < tk && !done.has(d.key) && d.units.length);
  const huecos = plan.filter(d => !d.rest && d.key >= tk && !done.has(d.key));
  const pendientes = all.map((_, i) => i).filter(i => !leidos.has(i));
  const capsAtrasados = atrasados.reduce((s, d) => s + d.units.length, 0);
  const aplicar = () => {
    const asig = {}, movidos = new Set(cal.reorg && reorgValido(cal.reorg, cal) ? cal.reorg.movidos : []);
    plan.forEach(d => { if (!d.rest) asig[d.key] = d.units.map(u => idx.get(u.label)); });
    atrasados.forEach(d => { asig[d.key] = []; movidos.add(d.key); });
    const base = Math.floor(pendientes.length / huecos.length);
    let extra = pendientes.length % huecos.length, i = 0;
    huecos.forEach(d => {
      const n = base + (extra-- > 0 ? 1 : 0);
      asig[d.key] = pendientes.slice(i, i + n);
      i += n;
    });
    cal.reorg = { fecha: tk, sig: planSig(cal), asig, movidos: [...movidos] };
  };
  return { atrasados, huecos, pendientes, capsAtrasados, aplicar };
}
function buildPlan(cal) {
  if (!cal.planStart || !cal.planEnd) return [];
  const start = parseKey(cal.planStart), end = parseKey(cal.planEnd);
  if (isNaN(start) || isNaN(end) || end < start) return [];
  const days = [];
  for (let d = new Date(start); d <= end && days.length < 400; d.setDate(d.getDate() + 1)) {
    const date = new Date(d);
    days.push({ key: toKey(date), date, rest: cal.restDays.includes(date.getDay()), units: [] });
  }
  // Plan recalculado: reparto guardado mientras no cambien libro, fechas ni descansos
  if (reorgValido(cal.reorg, cal)) {
    const all = buildUnits(cal), movidos = new Set(cal.reorg.movidos);
    days.forEach(d => {
      if (d.rest) return;
      d.units = (cal.reorg.asig[d.key] || []).map(i => all[i]).filter(Boolean);
      d.moved = movidos.has(d.key) && !d.units.length;
    });
    return days;
  }
  const reading = days.filter(d => !d.rest);
  const pending = buildUnits(cal).slice(preReadCount(cal));
  if (!reading.length) return days;
  const base = Math.floor(pending.length / reading.length);
  let extra = pending.length % reading.length, i = 0;
  reading.forEach(d => {
    const n = base + (extra-- > 0 ? 1 : 0);
    d.units = pending.slice(i, i + n);
    i += n;
  });
  return days;
}
function unitsText(units) {
  if (!units.length) return 'Día libre';
  const parts = [];
  const chaps = units.filter(u => u.kind === 'c');
  if (units.some(u => u.kind === 'p')) parts.push('Prólogo');
  if (chaps.length) {
    const a = chaps[0].n, b = chaps[chaps.length - 1].n;
    parts.push(a === b ? `Cap. ${a}` : `Cap. ${a}–${b}`);
  }
  if (units.some(u => u.kind === 'e')) parts.push('Epílogo');
  return parts.join(' + ');
}
function progress(cal) {
  const units = buildUnits(cal), plan = buildPlan(cal);
  const readIdx = new Set();
  for (let i = 0; i < preReadCount(cal); i++) readIdx.add(units[i].label);
  const doneSet = new Set(cal.done);
  plan.forEach(d => { if (doneSet.has(d.key)) d.units.forEach(u => readIdx.add(u.label)); });
  const readingDays = plan.filter(d => !d.rest && d.units.length);
  const daysDone = readingDays.filter(d => doneSet.has(d.key)).length;
  const total = units.length, read = readIdx.size;
  return {
    units, plan, readIdx, total, read, pct: total ? Math.round(read / total * 100) : 0, daysDone,
    readingDays: readingDays.length, next: readingDays.find(d => !doneSet.has(d.key)),
    today: plan.find(d => d.key === todayKey()), finished: read === total
  };
}

/* ================== Portadas (solo URL) ================== */
const fallbackInner = cal => `<span>${esc(cal.title || 'Tu libro')}</span>${cal.author ? `<small>${esc(cal.author)}</small>` : ''}`;
function coverHTML(cal, extra = '') {
  const inner = cal.cover
    ? `<img src="${esc(cal.cover)}" alt="Portada de ${esc(cal.title)}" loading="lazy" referrerpolicy="no-referrer" data-fb="${esc(fallbackInner(cal))}">`
    : `<div class="fallback">${fallbackInner(cal)}</div>`;
  return `<div class="portada">${inner}${extra}</div>`;
}
// Si un enlace de portada falla, se muestra la portada de texto
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.dataset.fb !== undefined) {
    const div = document.createElement('div');
    div.className = 'fallback';
    div.innerHTML = img.dataset.fb;
    img.replaceWith(div);
  }
}, true);

async function searchCovers(query) {
  const res = await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=16&q=' + encodeURIComponent(query));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return (data.items || []).filter(it => it.volumeInfo && it.volumeInfo.imageLinks).map(it => {
    const l = it.volumeInfo.imageLinks;
    const src = (l.thumbnail || l.smallThumbnail).replace('http://', 'https://').replace('&edge=curl', '');
    return { title: it.volumeInfo.title, authors: (it.volumeInfo.authors || []).join(', '), src, big: src.replace(/zoom=\d/, 'zoom=1') };
  });
}
async function resolveAutoCovers() {
  for (const cal of db.calendars.filter(c => c.autoCover && !c.cover)) {
    try {
      const r = await searchCovers(`intitle:"${cal.title}"${cal.author ? ' inauthor:' + cal.author : ''}`);
      cal.autoCover = false;
      if (r.length) {
        cal.cover = r[0].big;
        saveDB();
        if ((location.hash || '#/') === '#/') viewLibrary();
      }
    } catch (e) { /* sin conexión o límite de Google: se reintenta en otra visita */ }
  }
}

/* ================== Router ================== */
function route() {

  $$('#nav a').forEach(a => a.classList.toggle('activo', a.dataset.ruta === (r || '') || (r === 'editar' && a.dataset.ruta === 'nuevo')));
  const activo = $('#nav a.activo');
  $('#menu-lbl').textContent = activo ? activo.textContent.trim() : 'Menú';
  setMenu(false);
  window.scrollTo({ top: 0 });
  if (!r) return viewLibrary();
  if (r === 'nuevo') return viewForm(null);
  if (r === 'editar' && getCal(id)) return viewForm(getCal(id));
  if (r === 'cal' && getCal(id)) return viewCalendar(getCal(id));
  if (r === 'control') return viewControl();
  location.hash = '#/';
}

/* ================== Vista: Estantería ================== */
function viewLibrary() {

/* ================== Vista: Calendario ================== */
const capsTxt = n => `${n} ${n === 1 ? 'capítulo' : 'capítulos'}`;
function planBarraHTML(cal) {
  const r = planRecalculado(cal);
  const reorg = reorgValido(cal.reorg, cal);
  const aviso = r.capsAtrasados
    ? `<span class="plan-aviso">${ic('clock', 'relleno')}Llevas ${capsTxt(r.capsAtrasados)} pendientes de días anteriores</span>`
    : reorg ? `<span class="plan-aviso">${ic('replan', 'relleno')}Plan recalculado el ${fmtCorto.format(parseKey(cal.reorg.fecha))}</span>` : '';
  return `<div class="plan-barra">${aviso}
    ${reorg ? '<button class="enlace" type="button" id="planOriginal">Plan original</button>' : ''}
    <button class="btn mini ${r.capsAtrasados ? 'primario' : ''}" type="button" id="recalcular">${ic('replan')} Recalcular</button>
  </div>`;
}
async function recalcular(cal) {
  const r = planRecalculado(cal);
  if (!r.capsAtrasados) return toast('¡Vas al día! No hay capítulos atrasados', 'check');
  if (!r.huecos.length) return toast('No quedan días libres: amplía la fecha de fin en Editar', 'calendar');
  const min = Math.floor(r.pendientes.length / r.huecos.length), max = Math.ceil(r.pendientes.length / r.huecos.length);
  const ritmo = min === max ? capsTxt(min) : `${min}–${max} capítulos`;
  if (!await confirmar({
    titulo: '¿Recalculamos tu plan?',
    texto: `Recogeremos ${capsTxt(r.capsAtrasados)} de ${r.atrasados.length === 1 ? '1 día sin marcar' : r.atrasados.length + ' días sin marcar'} y repartiremos todo lo pendiente ${r.huecos.length === 1 ? 'el ' + fmtCorto.format(r.huecos[0].date) : `entre el ${fmtCorto.format(r.huecos[0].date)} y el ${fmtCorto.format(r.huecos[r.huecos.length - 1].date)} (${r.huecos.length} días)`}.`,
    nota: `Unos ${ritmo} al día`, notaIcon: cal.theme.icon, icono: 'replan', ok: 'Recalcular', okIcon: 'replan', cancelar: 'Ahora no'
  })) return;
  r.aplicar();
  cal.updatedAt = Date.now();
  saveDB();
  const y = window.scrollY;
  viewCalendar(cal);
  window.scrollTo({ top: y });
  toast('Plan recalculado', 'replan');
}

function viewCalendar(cal) {

        <section class="card tracker">

function mountDiario(cal) {

    inmediato ? hazlo() : (guardarT = setTimeout(hazlo, 450));
  };

  // Puntuación con medias estrellas
  const stars = $('#d-rating');
  const pintarEstrellas = v => {
    $$('.estrella', stars).forEach((s, i) => { $('.lleno', s).style.width = Math.max(0, Math.min(1, v - i)) * 100 + '%'; });
  };
  const pintarRating = () => {
    pintarEstrellas(cal.rating);
    stars.setAttribute('aria-valuenow', cal.rating);
    stars.setAttribute('aria-valuetext', cal.rating ? fmtNota(cal.rating) + ' de 5' : 'Sin puntuar');
    $('#d-rating-txt').innerHTML = cal.rating ? `<b>${fmtNota(cal.rating)}</b> · ${RATING_TXT[Math.ceil(cal.rating)]}` : RATING_TXT[0];
  };
  const valorEn = e => {
    const s = e.target.closest('.estrella');
    if (!s) return null;
    const r = s.getBoundingClientRect();
    return Number(s.dataset.i) - (e.clientX - r.left < r.width / 2 ? .5 : 0);
  };
  const setRating = v => { cal.rating = Math.min(5, Math.max(0, v)); pintarRating(); guardar(true); };
  stars.addEventListener('pointermove', e => { const v = valorEn(e); if (v !== null) pintarEstrellas(v); });
  stars.addEventListener('pointerleave', () => pintarEstrellas(cal.rating));
  stars.addEventListener('click', e => { const v = valorEn(e); if (v !== null) setRating(v === cal.rating ? 0 : v); });
  stars.addEventListener('keydown', e => {
    const d = { ArrowRight: .5, ArrowUp: .5, ArrowLeft: -.5, ArrowDown: -.5 }[e.key];
    if (d) { e.preventDefault(); setRating(cal.rating + d); }
    else if (e.key === 'Home' || e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); setRating(0); }

  });

  const spice = $('#d-spice');

  };

    const i = Number(b.dataset.i);

  });
  spice.addEventListener('pointerleave', () => pintarSpice());

  notas.addEventListener('input', () => { cal.notes = notas.value; $('#d-guardado').classList.remove('ok'); autoAlto(); guardar(); });
  notas.addEventListener('blur', () => guardar(true));
  autoAlto();

  // Frases
  const lista = $('#d-lista');
  const pintarFrases = () => {
    const qs = cal.quotes.slice().sort((a, b) => (b.fav - a.fav) || (b.at - a.at));
    $('#d-nfrases').textContent = cal.quotes.length;
    lista.innerHTML = qs.length ? qs.map(q => `
      <li class="frase ${q.fav ? 'fav' : ''}" data-id="${esc(q.id)}">
        <span class="comillas">${ic('quote')}</span>
        <p>${esc(q.text)}</p>
        <div class="pie">
          <span class="ref">${esc(q.ref)}</span>

            <button class="btn mini redondo" data-act="fav" aria-pressed="${q.fav}" aria-label="${q.fav ? 'Quitar de favoritas' : 'Marcar como favorita'}">${ic('heart', q.fav ? 'solida' : '')}</button>
            <button class="btn mini redondo" data-act="copy" aria-label="Copiar frase">${ic('copy')}</button>
            <button class="btn mini redondo peligro" data-act="del" aria-label="Borrar frase">${ic('trash')}</button>
          </span>
        </div>
      </li>`).join('') : `<li class="sin-frases">${ic('sparkle')}Aún no has guardado ninguna frase. Las favoritas aparecerán arriba.</li>`;
  };
  lista.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const q = cal.quotes.find(x => x.id === b.closest('.frase').dataset.id);
    if (!q) return;
    if (b.dataset.act === 'copy') return copyText(`“${q.text}”${q.ref ? ' — ' + q.ref : ''}\n${cal.title}${cal.author ? ', ' + cal.author : ''}`, 'Frase copiada');
    if (b.dataset.act === 'del') {
      confirmar({ titulo: '¿Borrar esta frase?', texto: `“${q.text.length > 90 ? q.text.slice(0, 90) + '…' : q.text}”`, icono: 'quote', ok: 'Borrar', okIcon: 'trash', peligro: true })
        .then(si => { if (!si) return; cal.quotes = cal.quotes.filter(x => x !== q); guardar(true); pintarFrases(); });
      return;
    } else q.fav = !q.fav;
    guardar(true);
    pintarFrases();
  });
  const frase = $('#d-frase');
  $('#d-form').addEventListener('submit', e => {
    e.preventDefault();
    const text = frase.value.trim();
    if (!text) { frase.focus(); return toast('Escribe la frase primero', 'warning'); }
    cal.quotes.push({ id: uid(), text, ref: $('#d-ref').value.trim(), fav: false, at: Date.now() });

  pintarSpice();
  pintarFrases();
}

function burst(ev, el, icon) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect();
  const x = ev && ev.clientX ? ev.clientX : r.left + r.width / 2;
  const y = ev && ev.clientY ? ev.clientY : r.top + r.height / 2;
  const cs = getComputedStyle(el);
  const fuerte = cs.getPropertyValue('--accent-strong').trim(), suave = cs.getPropertyValue('--accent').trim();
  const rnd = (a, b) => a + Math.random() * (b - a);
  const crear = (name, size, cls) => {
    const h = document.createElement('span');
    h.className = 'particula ' + cls;
    h.innerHTML = ic(name);
    h.style.width = h.style.height = size + 'px';
    h.style.color = cls.includes('alt') ? (suave || fuerte) : fuerte;
    document.body.appendChild(h);
    return h;
  };
  const base = (s, size) => `translate(${x - size / 2}px, ${y - size / 2}px) scale(${s})`;

  // Icono central que "late" como un like
  const c = crear(icon, 44, 'relleno');
  c.animate([
    { transform: base(0, 44), opacity: 1 },
    { transform: base(1.35, 44), opacity: 1, offset: .3 },
    { transform: base(.95, 44), opacity: 1, offset: .5 },
    { transform: base(1.05, 44), opacity: 1, offset: .65 },
    { transform: `translate(${x - 22}px, ${y - 22 - 26}px) scale(.9)`, opacity: 0 }
  ], { duration: 900, easing: 'ease-out', fill: 'forwards' }).onfinish = () => c.remove();

  const extra = [icon, icon, icon, 'heart', 'sparkle'];
  const n = 12;
  for (let i = 0; i < n; i++) {
    const ang = (-160 + (140 / (n - 1)) * i + rnd(-8, 8)) * Math.PI / 180;
    const dist = rnd(48, 105);
    const size = Math.round(rnd(15, 27));
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const giro = rnd(-40, 40);
    const cls = (Math.random() < .4 ? 'solida' : 'relleno') + (Math.random() < .45 ? ' alt' : '');
    const h = crear(extra[Math.floor(Math.random() * extra.length)], size, cls);
    const p = (k, s, rot, sube = 0) => `translate(${x - size / 2 + dx * k}px, ${y - size / 2 + dy * k - sube}px) rotate(${rot}deg) scale(${s})`;
    h.animate([
      { transform: p(0, .2, 0), opacity: 0 },
      { transform: p(.6, 1.15, giro * .5), opacity: 1, offset: .25 },
      { transform: p(1, 1, giro), opacity: 1, offset: .6 },
      { transform: p(1.08, .5, giro * 1.4, rnd(25, 45)), opacity: 0 }
    ], { duration: rnd(850, 1150), delay: rnd(40, 120), easing: 'cubic-bezier(.2, .8, .3, 1)', fill: 'both' }).onfinish = () => h.remove();
  }
}

/* ================== Compartir: tarjetas para stories ================== */
function readingStats(cal) {
  const p = progress(cal);
  const tk = todayKey();
  const doneSet = new Set(cal.done);
  const dias = p.plan.filter(d => !d.rest && d.units.length);
  // Racha: días de lectura seguidos completados hasta hoy (hoy cuenta solo si ya está hecho)
  let racha = 0;
  for (const d of dias.filter(d => d.key <= tk).reverse()) {
    if (doneSet.has(d.key)) racha++;
    else if (d.key === tk) continue;
    else break;
  }
  const inicio = cal.readingStart ? parseKey(cal.readingStart) : (cal.planStart ? parseKey(cal.planStart) : null);
  const diasLeyendo = inicio ? Math.max(1, Math.floor((new Date() - inicio) / 86400000) + 1) : 0;
  const quedan = dias.filter(d => d.key >= tk && !doneSet.has(d.key)).length;
  const ritmo = diasLeyendo ? p.read / diasLeyendo : 0;
  const necesario = quedan ? (p.total - p.read) / quedan : 0;
  return { p, racha, diasLeyendo, quedan, ritmo, necesario, dias, doneSet, tk };
}

    } else {
      extra.innerHTML = `<p class="share-tip">${ic('sparkle')}${esFrase && !cal.quotes.length ? 'Aún no tienes frases guardadas' : 'Desliza para ver más tarjetas'}</p>`;
    }
  };
  let scrollT;
  track.addEventListener('scroll', () => {
    clearTimeout(scrollT);
    scrollT = setTimeout(() => {
      const centro = track.scrollLeft + track.clientWidth / 2;
      let mejor = 0, dist = Infinity;
      slides().forEach((s, i) => { const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - centro); if (d < dist) { dist = d; mejor = i; } });
      if (mejor !== actual) { actual = mejor; marcar(); }
    }, 60);
  });
  track.addEventListener('click', e => { const s = e.target.closest('.share-slide'); if (s && Number(s.dataset.i) !== actual) ir(Number(s.dataset.i)); });
  puntos.addEventListener('click', e => { const b = e.target.closest('button'); if (b) ir(Number(b.dataset.i)); });
  extra.addEventListener('click', e => {
    const b = e.target.closest('[data-q]');

    const y = $('.share-frases', extra).scrollLeft;
    pintar();
    ir(actual, false);
    $('.share-frases', extra).scrollLeft = y;
  });

  const cerrar = () => {
    document.removeEventListener('keydown', teclas, true);
    modal.classList.add('saliendo');
    document.body.classList.remove('sin-scroll');
    setTimeout(() => modal.remove(), 220);
    if (prevFocus) prevFocus.focus({ preventScroll: true });
  };
  const salirCaptura = () => { const c = $('.captura-capa', modal); if (c) c.remove(); };
  const ajustes = $('.share-ajustes', modal);
  const pintarAjustes = () => {
    const s = db.share;
    $('#aj-show', ajustes).checked = s.showMark;
    $('#aj-mark', ajustes).value = s.mark;
    $('#aj-tag', ajustes).value = s.tag;
    $('.aj-marca', ajustes).classList.toggle('off', !s.showMark);
    $('#aj-mark', ajustes).disabled = !s.showMark;
    $$('[data-ico]', ajustes).forEach(b => { b.setAttribute('aria-checked', String(b.dataset.ico === s.markIcon)); b.disabled = !s.showMark; });
  };
  const aplicarFirma = () => {
    saveDB();
    $$('.st-marca', track).forEach(el => { el.outerHTML = storyMarca(); });
  };
  const toggleAjustes = abrir => {
    ajustes.hidden = !abrir;
    modal.classList.toggle('editando', abrir);
    $('[data-act="ajustes"]', modal).setAttribute('aria-expanded', String(abrir));
    if (abrir) { pintarAjustes(); $('#aj-mark', ajustes).disabled ? $('#aj-show', ajustes).focus() : $('#aj-mark', ajustes).focus({ preventScroll: true }); }
    requestAnimationFrame(() => ir(actual, false));
  };
  ajustes.addEventListener('input', e => {
    if (e.target.id === 'aj-mark') db.share.mark = e.target.value;
    else if (e.target.id === 'aj-tag') db.share.tag = e.target.value;
    else if (e.target.id === 'aj-show') { db.share.showMark = e.target.checked; pintarAjustes(); }
    aplicarFirma();
  });
  ajustes.addEventListener('click', e => {
    const b = e.target.closest('[data-ico]');
    if (!b) return;
    db.share.markIcon = b.dataset.ico;
    pintarAjustes();

  });
  const captura = () => {
    const capa = document.createElement('div');

    capa.addEventListener('click', salirCaptura);

  };
  function teclas(e) {
    if (e.key === 'Escape') { e.stopPropagation(); $('.captura-capa', modal) ? salirCaptura() : !ajustes.hidden ? toggleAjustes(false) : cerrar(); }
    else if (e.key === 'ArrowRight' && !e.target.closest('input, textarea')) { e.preventDefault(); ir(actual + 1); }
    else if (e.key === 'ArrowLeft' && !e.target.closest('input, textarea')) { e.preventDefault(); ir(actual - 1); }
  }
  document.addEventListener('keydown', teclas, true);
  modal.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) { if (e.target === modal || e.target.classList.contains('share-carrusel')) cerrar(); return; }
    const a = b.dataset.act;
    if (a === 'cerrar') cerrar();
    else if (a === 'prev') ir(actual - 1);
    else if (a === 'next') ir(actual + 1);
    else if (a === 'captura') captura();
    else if (a === 'ajustes') toggleAjustes(ajustes.hidden);
    else if (a === 'aj-ok') toggleAjustes(false);
    else if (a === 'aj-reset') { db.share = normalizeShare(SHARE_DEFAULT); pintarAjustes(); aplicarFirma(); }
    else if (a === 'texto') copyText(shareText(cal), 'Texto copiado al portapapeles');
  });

  pintar();
  requestAnimationFrame(() => { ir(actual, false); $('[data-act="cerrar"]', modal).focus({ preventScroll: true }); });
}

const capitalizar = s => s.charAt(0).toUpperCase() + s.slice(1);
const normTxt = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const addDays = (key, n) => { const d = parseKey(key); d.setDate(d.getDate() + n); return toKey(d); };
const emit = el => el.dispatchEvent(new Event('input', { bubbles: true }));

function openCtl(c) {

function closeCtl(c) {

document.addEventListener('pointerdown', e => $$('.ctl.abierto').forEach(c => { if (!c.contains(e.target)) closeCtl(c); }));

// Desplegable con buscador: guarda el valor en un input oculto para que el formulario lo lea igual que antes
function mountSelect(root, { id, options, value, label, placeholder = 'Elige una opción', searchPlaceholder = 'Buscar…', icon, renderOption, onOpen }) {
  root.classList.add('ctl');
  root.innerHTML = `
    <input type="hidden" id="${id}" value="${esc(value)}">
    <button type="button" class="ctl-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(label)}">
      ${icon ? ic(icon) : ''}<span class="val"></span>${ic('chevron', 'chev')}
    </button>

      <div class="ctl-search">${ic('search')}<input type="text" placeholder="${esc(searchPlaceholder)}" aria-label="Buscar en ${esc(label)}" autocomplete="off"></div>
      <div class="ctl-list" role="listbox" aria-label="${esc(label)}"></div>
    </div>`;
  const hidden = $('input[type=hidden]', root), trig = $('.ctl-trigger', root), val = $('.val', root);
  const search = $('.ctl-search input', root), list = $('.ctl-list', root);
  let filtered = options, active = 0;
  const marcar = (txt, q) => {
    const i = q ? normTxt(txt).indexOf(q) : -1;
    return i < 0 ? esc(txt) : esc(txt.slice(0, i)) + '<mark>' + esc(txt.slice(i, i + q.length)) + '</mark>' + esc(txt.slice(i + q.length));
  };
  const paintVal = () => {
    const o = options.find(x => x.value === hidden.value);
    val.textContent = o ? o.label : placeholder;
    val.classList.toggle('vacio', !o);
    if (o && o.style) val.setAttribute('style', o.style); else val.removeAttribute('style');
  };
  const paintList = () => {
    const q = normTxt(search.value.trim());
    filtered = options.filter(o => normTxt(o.label + ' ' + (o.tag || '')).includes(q));
    active = Math.min(active, Math.max(0, filtered.length - 1));
    list.innerHTML = filtered.length ? filtered.map((o, i) => {
      const sel = o.value === hidden.value;
      return `<div class="ctl-opt${sel ? ' sel' : ''}${i === active ? ' activa' : ''}" role="option" aria-selected="${sel}" data-v="${esc(o.value)}">
        ${renderOption ? renderOption(o, marcar(o.label, q)) : `<span class="nombre">${marcar(o.label, q)}</span>`}
        ${o.tag ? `<span class="tag">${esc(o.tag)}</span>` : ''}${sel ? ic('check') : ''}</div>`;
    }).join('') : '<div class="ctl-vacio">Sin resultados</div>';
    const a = $('.activa', list);
    if (a) a.scrollIntoView({ block: 'nearest' });
  };
  const choose = v => { hidden.value = v; paintVal(); closeCtl(root); trig.focus(); emit(hidden); };
  trig.addEventListener('click', () => {
    if (root.classList.contains('abierto')) return closeCtl(root);
    if (onOpen) onOpen();
    search.value = '';
    active = Math.max(0, options.findIndex(o => o.value === hidden.value));
    paintList();
    openCtl(root);
    search.focus({ preventScroll: true });
  });
  search.addEventListener('input', () => { active = 0; paintList(); });
  root.addEventListener('keydown', e => {
    if (!root.classList.contains('abierto')) {
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target === trig) { e.preventDefault(); trig.click(); }
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = Math.max(0, Math.min(filtered.length - 1, active + (e.key === 'ArrowDown' ? 1 : -1)));
      paintList();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (filtered[active]) choose(filtered[active].value);
    } else if (e.key === 'Tab') closeCtl(root);
  });
  list.addEventListener('click', e => { const o = e.target.closest('.ctl-opt'); if (o) choose(o.dataset.v); });
  list.addEventListener('mousemove', e => {
    const o = e.target.closest('.ctl-opt');
    if (!o) return;
    const i = filtered.findIndex(x => x.value === o.dataset.v);
    if (i !== active) { active = i; $$('.ctl-opt', list).forEach((el, j) => el.classList.toggle('activa', j === i)); }
  });
  paintVal();
}

// Selector de fecha propio: vista de días y de meses, atajos, rango resaltado y teclado
function mountDate(root, { id, value, label, placeholder = 'Elige una fecha', min, range, quick = [], extra, onChange }) {
  root.classList.add('ctl');
  root.dataset.date = '';
  root.innerHTML = `
    <input type="hidden" id="${id}" value="${esc(value || '')}">
    <button type="button" class="ctl-trigger" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(label)}">

    </button>
    <div class="ctl-pop" role="dialog" aria-label="${esc(label)}"></div>`;
  const hidden = $('input[type=hidden]', root), trig = $('.ctl-trigger', root), val = $('.val', root), ext = $('.extra', root), pop = $('.ctl-pop', root);
  let view, cursor, mode = 'dias';

  const paintVal = () => {
    val.textContent = hidden.value ? capitalizar(fmtBoton.format(parseKey(hidden.value))) : placeholder;
    val.classList.toggle('vacio', !hidden.value);
    const x = extra && hidden.value ? extra(hidden.value) : '';
    ext.hidden = !x;
    ext.textContent = x || '';
  };
  const paint = (focus = false) => {
    const minK = min ? min() : '';
    const [ra, rb] = range ? range() : ['', ''];
    const y = view.getFullYear(), m = view.getMonth();
    let html;
    if (mode === 'dias') {
      const offset = (new Date(y, m, 1).getDay() + 6) % 7;
      const nDias = new Date(y, m + 1, 0).getDate();
      const celdas = Math.ceil((offset + nDias) / 7) * 7;
      let dias = '';
      for (let i = 0; i < celdas; i++) {
        const d = new Date(y, m, 1 - offset + i), k = toKey(d);
        const cls = ['dp-day', d.getMonth() !== m ? 'fuera' : '', k === todayKey() ? 'hoy' : '', k === hidden.value ? 'sel' : '',
          k !== hidden.value && (k === ra || k === rb) ? 'ext' : '', ra && rb && k > ra && k < rb ? 'rango' : '', k === cursor ? 'cursor' : ''].join(' ');
        dias += `<button type="button" class="${cls}" data-k="${k}" tabindex="${k === cursor ? 0 : -1}" ${minK && k < minK ? 'disabled' : ''}
          aria-label="${capitalizar(fmtLargo.format(d))}" aria-pressed="${k === hidden.value}">${d.getDate()}</button>`;
      }
      html = `
        <div class="dp-head">
          <button type="button" class="dp-nav" data-act="prev" aria-label="Mes anterior">${ic('left')}</button>
          <button type="button" class="dp-titulo" data-act="modo" title="Elegir mes y año">${capitalizar(MESES[m])} ${y}</button>
          <button type="button" class="dp-nav" data-act="next" aria-label="Mes siguiente">${ic('right')}</button>
        </div>
        <div class="dp-grid">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<span class="dp-wd">${d}</span>`).join('')}${dias}</div>`;
    } else {
      const selK = hidden.value ? hidden.value.slice(0, 7) : '';
      html = `
        <div class="dp-head">
          <button type="button" class="dp-nav" data-act="prev" aria-label="Año anterior">${ic('left')}</button>
          <button type="button" class="dp-titulo" data-act="modo">${y}</button>
          <button type="button" class="dp-nav" data-act="next" aria-label="Año siguiente">${ic('right')}</button>
        </div>
        <div class="dp-grid meses">${MESES_CORTOS.map((n, i) => `<button type="button" class="dp-mes${selK === `${y}-${pad(i + 1)}` ? ' sel' : ''}" data-m="${i}">${n}</button>`).join('')}</div>`;
    }
    const atajos = quick.map((q, i) => ({ ...q, i })).filter(q => !q.show || q.show());
    if (atajos.length) html += `<div class="dp-quick">${atajos.map(q => `<button type="button" data-q="${q.i}" class="${q.danger ? 'peligro' : ''}">${esc(q.label)}</button>`).join('')}</div>`;
    pop.innerHTML = html;
    if (focus) { const c = $('.dp-day.cursor', pop) || $('.dp-mes.sel', pop) || $('.dp-titulo', pop); if (c) c.focus({ preventScroll: true }); }
  };
  const choose = k => {
    const prev = hidden.value;
    hidden.value = k || '';
    paintVal();
    closeCtl(root);
    trig.focus();
    if (onChange) onChange(hidden.value, prev);
    emit(hidden);
  };
  const moveCursor = n => {
    const k = addDays(cursor, n), minK = min ? min() : '';
    if (minK && k < minK) return;
    cursor = k;
    view = new Date(parseKey(k).getFullYear(), parseKey(k).getMonth(), 1);
    paint(true);
  };

  trig.addEventListener('click', () => {
    if (root.classList.contains('abierto')) return closeCtl(root);
    cursor = hidden.value || (min && min() > todayKey() ? min() : todayKey());
    view = new Date(parseKey(cursor).getFullYear(), parseKey(cursor).getMonth(), 1);
    mode = 'dias';
    paint();
    openCtl(root);
    const c = $('.dp-day.cursor', pop);
    if (c) c.focus({ preventScroll: true });
  });
  pop.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.k) return choose(b.dataset.k);
    if (b.dataset.q !== undefined) return choose(quick[b.dataset.q].get());
    if (b.dataset.m !== undefined) { view = new Date(view.getFullYear(), +b.dataset.m, 1); mode = 'dias'; return paint(true); }
    const act = b.dataset.act;
    if (act === 'modo') mode = mode === 'dias' ? 'meses' : 'dias';
    if (act === 'prev' || act === 'next') {
      const d = act === 'prev' ? -1 : 1;
      view = mode === 'dias' ? new Date(view.getFullYear(), view.getMonth() + d, 1) : new Date(view.getFullYear() + d, view.getMonth(), 1);
    }
    paint();
    const again = $(`[data-act="${act}"]`, pop);
    if (again) again.focus({ preventScroll: true });
  });
  pop.addEventListener('keydown', e => {
    if (mode !== 'dias' || !e.target.classList.contains('dp-day')) return;
    const mapa = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
    if (mapa[e.key]) { e.preventDefault(); moveCursor(mapa[e.key]); }
    else if (e.key === 'PageUp' || e.key === 'PageDown') {
      e.preventDefault();
      const d = parseKey(cursor);
      d.setMonth(d.getMonth() + (e.key === 'PageUp' ? -1 : 1));
      moveCursor(Math.round((d - parseKey(cursor)) / 86400000));
    } else if (e.key === 'Enter') { e.preventDefault(); choose(cursor); }
  });
  root.addEventListener('keydown', e => { if (e.key === 'Tab' && !pop.contains(e.target)) closeCtl(root); });
  root._set = k => { hidden.value = k || ''; paintVal(); };
  root._paint = paintVal;
  paintVal();
}

// Contador con botones redondos; mantener pulsado repite el paso
function mountSteppers(root) {
  $$('.stepper', root).forEach(st => {
    const inp = $('input', st), [menos, mas] = $$('button', st);
    const lim = () => [Number(inp.min) || 0, Number(inp.max) || 9999];
    const sync = () => { const [a, b] = lim(), v = parseInt(inp.value) || 0; menos.disabled = v <= a; mas.disabled = v >= b; };
    const step = d => {
      const [a, b] = lim();
      const v = Math.min(b, Math.max(a, (parseInt(inp.value) || 0) + d));
      if (String(v) !== inp.value) { inp.value = v; emit(inp); }
      sync();
    };
    [menos, mas].forEach(btn => {
      let t1, t2;
      const stop = () => { clearTimeout(t1); clearInterval(t2); };
      btn.addEventListener('pointerdown', e => {
        if (btn.disabled) return;
        e.preventDefault();
        const d = Number(btn.dataset.step);
        step(d);
        t1 = setTimeout(() => { t2 = setInterval(() => { step(d); if (btn.disabled) stop(); }, 70); }, 420);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
      btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(Number(btn.dataset.step)); } });
    });
    inp.addEventListener('input', sync);
    inp.addEventListener('blur', () => step(0));
    st._sync = sync;
    sync();
  });
}
const stepperHTML = (id, value, min, max) => `<div class="stepper">
  <button type="button" data-step="-1" aria-label="Restar uno">${ic('minus')}</button>
  <input type="number" id="${id}" min="${min}" max="${max}" value="${value}" inputmode="numeric">
  <button type="button" data-step="1" aria-label="Sumar uno">${ic('plus')}</button></div>`;

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0');
  return `#${f(0)}${f(8)}${f(4)}`;
}
function nombreTono(h) {
  const nombres = [[15, 'Rosa fresa'], [35, 'Melocotón'], [55, 'Vainilla'], [75, 'Limonada'], [110, 'Pistacho'], [160, 'Menta'], [190, 'Agua'],
    [220, 'Cielo'], [250, 'Pervinca'], [280, 'Lavanda'], [310, 'Lila'], [340, 'Chicle'], [360, 'Rosa fresa']];
  return nombres.find(([max]) => h <= max)[1];
}
