            <div class="campo"><label class="lbl" for="f-last">Último capítulo leído</label>${stepperHTML('f-last', draft.lastRead, 0, draft.totalChapters)}<span class="ayuda">0 si aún no has empezado</span></div>
            <div class="campo full switches">
              <label class="switch"><input type="checkbox" id="f-pro" ${draft.prologue ? 'checked' : ''}> Tiene prólogo</label>
              <label class="switch"><input type="checkbox" id="f-epi" ${draft.epilogue ? 'checked' : ''}> Tiene epílogo</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>${bubble('calendar')} Fechas</legend>
          <div class="campos">
            <div class="campo"><span class="lbl">Inicio del calendario *</span><div id="c-start"></div></div>
            <div class="campo"><span class="lbl">Quiero terminarlo el *</span><div id="c-end"></div></div>
            <div class="campo"><span class="lbl">Empecé a leerlo el</span><div id="c-reading"></div><span class="ayuda">Opcional, para contar los días leyendo</span></div>
            <div class="campo">
              <span class="lbl">Días de descanso</span>
              <div class="chips">${WEEKDAYS.map(([l, n]) => `<label class="chip"><input type="checkbox" name="rest" value="${n}" ${draft.restDays.includes(n) ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>${bubble('palette')} Estética</legend>
          <div class="campos">
            <div class="campo full ctl" id="f-colorctl">
              <span class="lbl">Paleta pastel</span>
              <div class="paletas" id="f-paletas">
                ${PALETTES.map(p => `<button type="button" class="paleta" data-c="${p.c}" aria-label="Paleta ${p.name}">
                  <span class="muestras">${pastelSwatches(p.c).map(c => `<i style="background:${c}"></i>`).join('')}</span>${p.name}</button>`).join('')}
                <button type="button" class="paleta" id="f-custom" aria-haspopup="dialog" aria-expanded="false" title="Crea tu propio pastel">
                  <span class="muestras" id="f-custom-sw"></span>A tu gusto
                </button>
              </div>
              <div class="ctl-pop" role="dialog" aria-label="Color a tu gusto">
                <div class="color-prev"><span class="muestras" id="f-color-sw"></span><b id="f-color-name"></b></div>
                <div class="deslizador"><label class="lbl" for="f-hue">Tono</label><input type="range" class="slider tono" id="f-hue" min="0" max="359"></div>
                <div class="deslizador"><label class="lbl" for="f-sat"><span>Intensidad</span><span>suave · viva</span></label><input type="range" class="slider" id="f-sat" min="28" max="62"></div>
                <div class="acciones">
                  <button type="button" class="btn mini" id="f-random">${ic('sparkle')} Sorpréndeme</button>
                  <button type="button" class="btn mini primario" id="f-color-ok">${ic('check')} Listo</button>
                </div>
              </div>
            </div>
            <div class="campo">
              <span class="lbl">Letra del título</span>
              <div id="c-font"></div>
            </div>
            <div class="campo full">
              <span class="lbl">Icono al completar un día</span>
              <div class="iconos" id="f-icons">${MARK_ICONS.map(i => `<button type="button" data-i="${i}" title="${MARK_NAMES[i]}" aria-label="${MARK_NAMES[i]}" class="relleno">${ic(i)}</button>`).join('')}</div>
            </div>
            <div class="campo full">
              <label class="lbl" for="f-msg">Mensaje al terminar</label>
              <textarea id="f-msg" maxlength="200">${esc(draft.finalMessage)}</textarea>
            </div>
          </div>
        </fieldset>

        <div class="acciones form-acciones">
          <button type="submit" class="btn primario">${existing ? ic('save') + ' Guardar cambios' : ic('plus') + ' Crear calendario'}</button>
          <a class="btn" href="${existing ? '#/cal/' + esc(existing.id) : '#/'}">Cancelar</a>
          ${existing ? `<button type="button" class="btn" id="f-dup">${ic('copy')} Duplicar</button><button type="button" class="btn peligro" id="f-del">${ic('trash')} Eliminar</button>` : ''}
        </div>
      </form>

      <div class="preview">
        <div id="p-cover"></div>
        <div class="card resumen-plan" id="p-resumen"></div>
      </div>
    </div>`;

  const form = $('#form');
  mountSteppers(form);

  const diasEntre = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000) + 1;
  const proxLunes = () => { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); return toKey(d); };
  mountDate($('#c-start'), {
    id: 'f-start', value: draft.planStart, label: 'Inicio del calendario', range: () => [draft.planStart, draft.planEnd],
    quick: [{ label: 'Hoy', get: todayKey }, { label: 'Mañana', get: () => addDays(todayKey(), 1) }, { label: 'Próximo lunes', get: proxLunes }],
    // Si el nuevo inicio deja el fin por detrás, se mantiene la duración que tenía el plan
    onChange: (k, prev) => {
      if (k && prev && draft.planEnd && draft.planEnd < k) $('#c-end')._set(addDays(k, Math.max(1, diasEntre(prev, draft.planEnd)) - 1));
    }
  });
  mountDate($('#c-end'), {
    id: 'f-end', value: draft.planEnd, label: 'Fecha de fin', min: () => draft.planStart, range: () => [draft.planStart, draft.planEnd],
    extra: k => draft.planStart && k >= draft.planStart ? `${diasEntre(draft.planStart, k)} días` : '',
    quick: [7, 14, 21, 30].map(n => ({ label: `${n} días`, get: () => addDays(draft.planStart || todayKey(), n - 1) }))
  });
  mountDate($('#c-reading'), {
    id: 'f-reading', value: draft.readingStart, label: 'Empecé a leerlo el', placeholder: 'Sin fecha',
    extra: k => { const n = diasEntre(k, todayKey()) - 1; return n > 0 ? `hace ${n} ${n === 1 ? 'día' : 'días'}` : ''; },
    quick: [
      { label: 'Hoy', get: todayKey },
      { label: 'Igual que el inicio', get: () => draft.planStart, show: () => !!draft.planStart },
      { label: 'Quitar fecha', get: () => '', danger: true, show: () => !!draft.readingStart }
    ]
  });
  mountSelect($('#c-font'), {
    id: 'f-font', value: draft.theme.font, label: 'Letra del título', icon: 'type', searchPlaceholder: 'Busca una letra o un estilo…',
    options: FONT_LIST.map(f => ({ value: f.name, label: f.name, tag: f.cat, style: `font-family:'${f.name}',cursive;font-size:1.25rem` })),
    renderOption: (o, html) => `<span class="nombre" style="font-family:'${o.value}',cursive">${html}</span>`,
    onOpen: () => ensureFonts(FONTS)
  });

  const colorCtl = $('#f-colorctl'), hue = $('#f-hue'), sat = $('#f-sat');
  const syncSliders = () => { const { h, s } = hexToHsl(draft.theme.accent); hue.value = h; sat.value = Math.min(62, Math.max(28, s)); };
  const paintColor = () => {
    const h = Number(hue.value);
    sat.style.setProperty('--track', `linear-gradient(90deg, hsl(${h},28%,84%), hsl(${h},62%,78%))`);
    $('#f-color-sw').innerHTML = pastelSwatches(draft.theme.accent).map(c => `<i style="background:${c}"></i>`).join('');
    $('#f-color-name').textContent = nombreTono(h);
  };
  const fromSliders = () => { draft.theme.accent = hslToHex(Number(hue.value), Number(sat.value), 80); refresh(); };
  hue.addEventListener('input', fromSliders);
  sat.addEventListener('input', fromSliders);
  $('#f-custom').addEventListener('click', () => {
    if (colorCtl.classList.contains('abierto')) return closeCtl(colorCtl);
    syncSliders();
    paintColor();
    openCtl(colorCtl);
  });
  $('#f-random').addEventListener('click', () => {
    hue.value = Math.floor(Math.random() * 360);
    sat.value = 34 + Math.floor(Math.random() * 22);
    fromSliders();
  });
  $('#f-color-ok').addEventListener('click', () => { closeCtl(colorCtl); $('#f-custom').focus(); });

  function readForm() {
    draft.title = $('#f-title').value.trim();
    draft.author = $('#f-author').value.trim();
    draft.totalChapters = Math.max(1, Math.min(500, parseInt($('#f-total').value) || 1));
    const last = $('#f-last');
    last.max = draft.totalChapters;
    if ((parseInt(last.value) || 0) > draft.totalChapters) last.value = draft.totalChapters;
    last.parentElement._sync();
    draft.lastRead = Math.max(0, parseInt(last.value) || 0);
    draft.prologue = $('#f-pro').checked;
    draft.epilogue = $('#f-epi').checked;
    draft.planStart = $('#f-start').value;
    draft.planEnd = $('#f-end').value;
    draft.readingStart = $('#f-reading').value;
    draft.restDays = $$('input[name=rest]:checked').map(i => Number(i.value));
    draft.theme.font = $('#f-font').value;
    draft.finalMessage = $('#f-msg').value.trim();
  }

  function validate() {
    const errs = [];
    if (!draft.title) errs.push('Añade un título.');
    if (!draft.planStart || !draft.planEnd) errs.push('Indica las fechas de inicio y fin.');
    else if (parseKey(draft.planEnd) < parseKey(draft.planStart)) errs.push('La fecha de fin es anterior a la de inicio.');
    else if ((parseKey(draft.planEnd) - parseKey(draft.planStart)) / 86400000 > 365) errs.push('El calendario no puede durar más de un año.');
    if (draft.lastRead > draft.totalChapters) errs.push('El último capítulo leído supera el total.');
    if (draft.planStart && draft.planEnd && buildPlan(draft).length && buildPlan(draft).every(d => d.rest)) errs.push('Todos los días son de descanso.');
    return errs;
  }

  function refresh() {
    applyTheme(draft.theme);
    $('#f-cover-prev').innerHTML = coverHTML(draft);
    $('#p-cover').innerHTML = coverHTML(draft);
    $$('#f-paletas .paleta[data-c]').forEach(s => s.classList.toggle('sel', s.dataset.c.toLowerCase() === draft.theme.accent.toLowerCase()));
    $('#f-custom').classList.toggle('sel', !esPreset(draft.theme.accent));
    $('#f-custom-sw').innerHTML = esPreset(draft.theme.accent)
      ? '<i class="arcoiris"></i>'
      : pastelSwatches(draft.theme.accent).map(c => `<i style="background:${c}"></i>`).join('');
    if (colorCtl.classList.contains('abierto')) paintColor();
    $$('.ctl[data-date]').forEach(c => c._paint());
    $$('#f-icons button').forEach(b => b.classList.toggle('sel', b.dataset.i === draft.theme.icon));

    const errs = validate();
    const plan = buildPlan(draft);
    const lectura = plan.filter(d => !d.rest);
    const pendientes = buildUnits(draft).length - preReadCount(draft);
    const media = lectura.length ? pendientes / lectura.length : 0;
    $('#p-resumen').innerHTML = `
      <h3>${esc(draft.title || 'Tu libro')}</h3>
      ${errs.length ? errs.map(e => `<p class="aviso">${ic('warning')} ${esc(e)}</p>`).join('') : `
        <p><b>${pendientes}</b> lecturas en <b>${lectura.length}</b> días${plan.length - lectura.length ? ` (+${plan.length - lectura.length} de descanso)` : ''}</p>
        <p>≈ <b>${media.toFixed(1)}</b> capítulos al día</p>
        <div class="mini-grid">${plan.slice(0, 70).map(d => `<div class="${d.rest ? 'r' : ''}" title="${d.key}: ${esc(d.rest ? 'Descanso' : unitsText(d.units))}">${d.rest ? '–' : d.units.length}</div>`).join('')}</div>`}`;
  }

  form.addEventListener('input', e => {
    if (e.target.id === 'f-url' || e.target.closest('.ctl-pop')) return;
    readForm();
    refresh();
  });
  form.addEventListener('change', e => { if (e.target.name === 'rest') { readForm(); refresh(); } });

  $('#f-paletas').addEventListener('click', e => {
    const s = e.target.closest('.paleta[data-c]');
    if (!s) return;
    draft.theme.accent = s.dataset.c;
    closeCtl(colorCtl);
    refresh();
  });
  $('#f-icons').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    draft.theme.icon = b.dataset.i;
    refresh();
  });

  $('#f-url').addEventListener('change', e => {
    const v = e.target.value.trim();
    if (v && !isHttpUrl(v)) { toast('La URL debe empezar por http:// o https://', 'warning'); return; }
    draft.cover = v || null;
    draft.autoCover = false;
    refresh();
  });
  $('#f-nocover').addEventListener('click', () => {
    draft.cover = null;
    draft.autoCover = false;
    $('#f-url').value = '';
    $('#f-resultados').innerHTML = '';
    refresh();
  });
  $('#f-google').addEventListener('click', async () => {
    readForm();
    if (!draft.title) { toast('Escribe primero el título', 'warning'); return; }
    const cont = $('#f-resultados');
    cont.innerHTML = '<span class="ayuda">Buscando…</span>';
    try {
      const r = await searchCovers(`intitle:${draft.title}${draft.author ? ' inauthor:' + draft.author : ''}`);
      cont.innerHTML = r.length
        ? r.map((x, i) => `<button type="button" data-i="${i}" title="${esc(x.title)} · ${esc(x.authors)}"><img src="${esc(x.src)}" alt="${esc(x.title)}"></button>`).join('')
        : '<span class="ayuda">No encontré portadas. Prueba a pegar una URL.</span>';
      cont.onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        draft.cover = r[b.dataset.i].big;
        draft.autoCover = false;
        $('#f-url').value = draft.cover;
        refresh();
      };
    } catch (err) {
      cont.innerHTML = '<span class="ayuda">Google Books no responde ahora mismo. Inténtalo en un rato o pega una URL.</span>';
    }
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    readForm();
    const urlVal = $('#f-url').value.trim();
    if (urlVal && isHttpUrl(urlVal)) draft.cover = urlVal;
    const errs = validate();
    if (errs.length) { toast(errs[0], 'warning'); return; }
    const validKeys = new Set(buildPlan(draft).filter(d => !d.rest).map(d => d.key));
    draft.done = draft.done.filter(k => validKeys.has(k));
    draft.updatedAt = Date.now();
    const cal = normalizeCal(draft);
    const idx = db.calendars.findIndex(c => c.id === cal.id);
    const backup = db.calendars.slice();
    if (idx >= 0) db.calendars[idx] = cal; else db.calendars.push(cal);
    if (!saveDB()) { db.calendars = backup; return; }
    toast(existing ? 'Cambios guardados' : 'Calendario creado', existing ? 'save' : 'sparkle');
    location.hash = '#/cal/' + cal.id;
  });

  if (existing) {
    $('#f-del').addEventListener('click', () => deleteCalendar(existing.id));
    $('#f-dup').addEventListener('click', () => {
      const copia = normalizeCal({ ...JSON.parse(JSON.stringify(existing)), id: uid(), title: existing.title + ' (copia)', done: [], rating: 0, spice: 0, notes: '', quotes: [], createdAt: Date.now(), updatedAt: Date.now() });
      db.calendars.push(copia);
      if (saveDB()) { toast('Calendario duplicado', 'copy'); location.hash = '#/editar/' + copia.id; }
      else db.calendars.pop();
    });
  }

  refresh();
}

async function deleteCalendar(id) {
  const cal = getCal(id);
  if (!cal) return;
  const si = await confirmar({
    titulo: `¿Eliminar ${cal.title}?`, texto: 'Se borrará el calendario con todo su progreso, notas y frases.',
    nota: 'No se puede deshacer', notaIcon: 'warning', icono: 'trash', ok: 'Eliminar', okIcon: 'trash', peligro: true
  });
  if (!si) return;
  db.calendars = db.calendars.filter(c => c.id !== id);
  saveDB();
  toast('Calendario eliminado', 'trash');
  if (location.hash.startsWith('#/control')) viewControl(); else location.hash = '#/';
}

/* ================== Vista: Panel de control ================== */
function exportCalendars(cals, nombre) {
  download(nombre, JSON.stringify({ app: 'chapter-and-chill', version: 1, exportedAt: new Date().toISOString(), calendars: cals }, null, 2), 'application/json');
  toast('Copia exportada', 'download');
}

function exportCSV() {
  const filas = [['Calendario', 'Autor', 'Fecha', 'Lectura', 'Estado', 'Progreso total']];
  db.calendars.forEach(cal => {
    const p = progress(cal);
    const doneSet = new Set(cal.done);
    p.plan.forEach(d => filas.push([
      cal.title, cal.author, d.key, d.rest ? 'Descanso' : unitsText(d.units),
      d.rest ? '-' : (doneSet.has(d.key) ? 'Completado' : 'Pendiente'), `${p.read}/${p.total} (${p.pct}%)`
    ]));
  });
  const csv = '\ufeff' + filas.map(f => f.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  download(`progreso-lectura-${todayKey()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('Progreso exportado en CSV', 'chart');
}

function importFile(file, modo) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const lista = Array.isArray(data) ? data : data.calendars;
      if (!Array.isArray(lista)) throw new Error('formato');
      const cals = lista.filter(c => c && c.title && c.planStart && c.planEnd).map(normalizeCal);
      if (!cals.length) throw new Error('vacío');
      const backup = db.calendars;
      if (modo === 'replace') db.calendars = cals;
      else {
        db.calendars = [...db.calendars];
        cals.forEach(c => {
          const i = db.calendars.findIndex(x => x.id === c.id);
          if (i >= 0) db.calendars[i] = c; else db.calendars.push(c);
        });
      }
      if (!saveDB()) { db.calendars = backup; return; }
      toast(`${cals.length} calendario(s) importado(s)`, 'upload');
      viewControl();
    } catch (e) {
      toast('El archivo no es una copia válida de Chapter & Chill', 'warning');
    }
  };
  reader.readAsText(file);
}

          </div>
          <label class="btn" for="impFile">${ic('upload')} Elegir archivo</label>
          <input type="file" id="impFile" accept="application/json,.json" hidden>
        </div>
      </section>

      <section class="card panel">
        <h2 class="sec-titulo">${bubble('warning')} Zona delicada</h2>

        <div class="acciones">
          <button class="btn peligro" id="borrarTodo">${ic('trash')} Borrar todo</button>
          <button class="btn" id="restaurar">${ic('reset')} Restaurar Wild Love</button>
        </div>

      <section class="card panel full">

    copyText('Mis lecturas · Chapter & Chill\n' + db.calendars.map((c, i) =>
      `${progs[i].finished ? '[terminado]' : '[leyendo]'} ${c.title} — ${progs[i].pct}% (${progs[i].read}/${progs[i].total})`
    ).join('\n') + '\n#booktok', 'Resumen copiado');
  });
  $('#impFile').addEventListener('change', async e => {

      titulo: '¿Reemplazar todo?', texto: 'Tus calendarios actuales se sustituirán por los del archivo.',
      icono: 'upload', ok: 'Reemplazar', okIcon: 'upload', peligro: true
    })) return;
    importFile(f, modo);
  });
  $('#borrarTodo').addEventListener('click', async () => {
    if (!await confirmar({
      titulo: '¿Borrar toda la estantería?', texto: 'Se eliminarán todos tus calendarios de este navegador.',
      nota: 'Exporta una copia antes', notaIcon: 'download', icono: 'trash', ok: 'Borrar todo', okIcon: 'trash', peligro: true
    })) return;
    db.calendars = [];
    saveDB();
    toast('Todo borrado', 'trash');
    viewControl();
  });
  $('#restaurar').addEventListener('click', () => {
    db.calendars = db.calendars.filter(c => c.id !== 'wild-love');
    db.calendars.push(seedWildLove());
    saveDB();
    toast('Wild Love restaurado', 'heart');
    viewControl();
  });
  $$('[data-exp]').forEach(b => b.addEventListener('click', () => {
    const c = getCal(b.dataset.exp);
    exportCalendars([c], `${slug(c.title)}.json`);
  }));
  $$('[data-del]').forEach(b => b.addEventListener('click', () => deleteCalendar(b.dataset.del)));
}

/* ================== Inicio ================== */
$('#logo').insertAdjacentHTML('afterbegin', `<span class="burbuja">${ic('logo', 'relleno')}</span>`);
// PWA: el service worker solo funciona servido por http(s), no abriendo el archivo local
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// Pide al navegador que no borre los calendarios cuando le falte espacio
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(ok => ok || navigator.storage.persist()).catch(() => {});
}
$('#footer').innerHTML = `${ic('save')} Todo se guarda en este navegador · Exporta tu copia desde Control`;
hydrateIcons();

const menuBtn = $('#menu-btn'), navEl = $('#nav');
function setMenu(abrir) {
  navEl.classList.toggle('abierto', abrir);
  menuBtn.setAttribute('aria-expanded', String(abrir));
}
// Si el logo y el menú no caben juntos (o la pantalla es muy estrecha) se usa el desplegable
function checkHeader() {
  const bar = $('.topbar'), wrap = $('.wrap', bar);
  bar.classList.remove('estrecha', 'compacta', 'mini');
  const cs = getComputedStyle(wrap);
  const libre = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const logoW = () => { const l = $('#logo'), b = $('b', l); return l.scrollWidth - b.clientWidth + b.scrollWidth; };
  const cabe = () => logoW() + (bar.classList.contains('estrecha') ? menuBtn.offsetWidth : navEl.scrollWidth) + 16 <= libre;
  if (!cabe()) bar.classList.add('compacta');
  if (innerWidth < 480 || !cabe()) bar.classList.add('estrecha');
  if (!cabe()) bar.classList.add('mini');
  if (!bar.classList.contains('estrecha')) setMenu(false);
}
menuBtn.addEventListener('click', e => { e.stopPropagation(); setMenu(!navEl.classList.contains('abierto')); });
navEl.addEventListener('click', () => setMenu(false));
document.addEventListener('click', e => { if (navEl.classList.contains('abierto') && !navEl.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && navEl.classList.contains('abierto')) { setMenu(false); menuBtn.focus(); } });
window.addEventListener('resize', checkHeader);
if (document.fonts) document.fonts.ready.then(checkHeader);
checkHeader();
route();
</script>
</body>
